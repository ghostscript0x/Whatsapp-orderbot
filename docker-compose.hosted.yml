# Hosted on this VPS, reusing the existing infrastructure containers:
#   - postgresql (postgresql_default network)  -> orderbot database
#   - redis      (big-bear-redis_default net)  -> BullMQ queues, dedupe, locks
#   - OpenWA     (https://openwa.ghostlab.name.ng) -> WhatsApp gateway
#   - Garage     (https://garage.ghostlab.name.ng) -> product images (S3)
#
# Deploy / update:
#   docker compose -f docker-compose.hosted.yml up -d --build
#   docker compose -f docker-compose.hosted.yml logs -f app worker

name: orderbot

x-app-env: &app-env
  env_file: .env.production
  environment:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"

services:
  # One-shot: applies pending Prisma migrations, then exits. app/worker wait for success.
  migrate:
    build: { context: ., dockerfile: Dockerfile.worker }
    image: orderbot-worker:local
    <<: *app-env
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    networks:
      - postgresql_default

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: orderbot-app:local
    restart: unless-stopped
    <<: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Host port 3000: point your ngrok/cloudflared tunnel at http://<host-ip>:3000.
    ports:
      - "3000:3000"
    networks:
      - postgresql_default
      - big-bear-redis_default

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    image: orderbot-worker:local
    restart: unless-stopped
    <<: *app-env
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks:
      - postgresql_default
      - big-bear-redis_default

networks:
  postgresql_default:
    external: true
  big-bear-redis_default:
    external: true
