services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orderbot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orderbot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  # Local S3-compatible storage (MinIO's Docker Hub image is no longer published).
  # Anonymous access: local dev only. Create the bucket once:
  #   aws --endpoint-url http://localhost:8333 s3 mb s3://products
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -dir=/data
    ports: ["8333:8333"]
    volumes: [s3data:/data]

volumes:
  pgdata:
  redisdata:
  s3data:
